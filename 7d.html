<!DOCTYPE html>
<html>
  <body>
    <script>
      function converttofarenheit(celcius) {
        if(!celcius) {
          console.log('No input');
        }
        else{
        console.log((celcius*(9/5))+32);
      }
    }
      
      converttofarenheit(60);
      converttofarenheit();
      

    function converttocelcius(farenheit){
      let celcius=(farenheit-32)*(9/5);
      console.log(celcius);

    }
    converttocelcius(40);
    


    function converttemperature(temp,unit){
      if (unit === 'c') {
        console.log((temp - 32) * (5 / 9));
      }
      else if (unit === 'f'){
        console.log(((temp * (9 / 5)) + 32));
      }
    }
    converttemperature(40,'c');
    converttemperature(60, 'f');


    </script>
  </body>
</html>
